name: Sync main from team repo

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # --force: the fork's own bot commit (the activity graph) makes main diverge, and a plain sync then fails
      - run: gh repo sync "$GITHUB_REPOSITORY" --branch main --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
